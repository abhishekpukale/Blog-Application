<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Details - MyBlog</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        nav {
            background-color: #222;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            color: white;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .details-container {
            max-width: 700px;
            margin: 50px auto;
            background-color: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .details-container h1 {
            margin-bottom: 10px;
        }

        .author {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .content {
            line-height: 1.7;
            color: #333;
            white-space: pre-wrap;
            margin-bottom: 25px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #222;
            font-weight: bold;
            text-decoration: none;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 5px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .edit-btn {
            background-color: #222;
            color: white;
        }

        .edit-btn:hover {
            background-color: #444;
        }

        .delete-btn {
            background-color: #d9534f;
            color: white;
        }

        .delete-btn:hover {
            background-color: #b52b27;
        }

        footer {
            text-align: center;
            padding: 25px;
            background-color: #222;
            color: white;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <nav>
        <h2>MyBlog</h2>

        <div>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="create-blog.html">Create Blog</a>
        </div>
    </nav>

    <div class="details-container" id="blogDetails">
        <a href="dashboard.html" class="back-link">&larr; Back to Dashboard</a>
        <p>Loading blog...</p>
    </div>

    <footer>
        <p>© 2026 MyBlog. All Rights Reserved.</p>
    </footer>

    <script>
        const params = new URLSearchParams(window.location.search);
        const blogId = params.get("id");

        async function loadBlogDetails() {
            const container = document.getElementById("blogDetails");

            if (!blogId) {
                container.innerHTML = `
                    <a href="dashboard.html" class="back-link">&larr; Back to Dashboard</a>
                    <p>No blog selected.</p>
                `;
                return;
            }

            try {
                const response = await fetch(`http://localhost:5000/api/blogs/${blogId}`);

                if (!response.ok) {
                    throw new Error("Blog not found");
                }

                const blog = await response.json();

                container.innerHTML = `
                    <a href="dashboard.html" class="back-link">&larr; Back to Dashboard</a>
                    <h1>${blog.title}</h1>
                    <p class="author">By: ${blog.author}</p>
                    <p class="content">${blog.content}</p>
                    <div class="action-buttons">
                        <a href="edit-blog.html?id=${blog._id}" class="btn edit-btn">Edit</a>
                        <button class="btn delete-btn" id="deleteBtn">Delete</button>
                    </div>
                `;

                document.getElementById("deleteBtn").addEventListener("click", deleteBlog);

            } catch (error) {
                container.innerHTML = `
                    <a href="dashboard.html" class="back-link">&larr; Back to Dashboard</a>
                    <p>Unable to load this blog. It may have been removed, or the backend server is not running.</p>
                `;
                console.error(error);
            }
        }

        async function deleteBlog() {
            const confirmed = confirm("Are you sure you want to delete this blog? This cannot be undone.");

            if (!confirmed) {
                return;
            }

            try {
                const response = await fetch(`http://localhost:5000/api/blogs/${blogId}`, {
                    method: "DELETE"
                });

                const data = await response.json();

                alert(data.message);

                if (response.ok) {
                    window.location.href = "dashboard.html";
                }

            } catch (error) {
                alert("Unable to connect to the backend server.");
                console.error(error);
            }
        }

        loadBlogDetails();
    </script>

</body>
</html>
