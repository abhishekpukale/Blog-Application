<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MyBlog</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        nav {
            background-color: #222;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            color: white;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .logout-btn {
            background: none;
            border: 1px solid white;
            color: white;
            padding: 6px 14px;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 20px;
            font-size: 14px;
        }

        .logout-btn:hover {
            background-color: white;
            color: #222;
        }

        .dashboard {
            padding: 40px 8%;
        }

        .profile-box {
            background-color: white;
            padding: 20px 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .profile-box h2 {
            margin-bottom: 5px;
        }

        .profile-box p {
            color: #666;
        }

        .dashboard h1 {
            margin-bottom: 10px;
        }

        .dashboard > p {
            color: #666;
            margin-bottom: 30px;
        }

        .create-btn {
            display: inline-block;
            background-color: #222;
            color: white;
            padding: 12px 18px;
            border-radius: 5px;
            text-decoration: none;
            margin-bottom: 30px;
        }

        .blog-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .blog-card {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            width: 300px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .blog-card h3 {
            margin-bottom: 10px;
        }

        .blog-card p {
            color: #666;
            margin-bottom: 15px;
        }

        .author {
            font-size: 14px;
            color: #333;
            margin-bottom: 15px;
        }

        footer {
            text-align: center;
            padding: 25px;
            background-color: #222;
            color: white;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <nav>
        <h2>MyBlog</h2>

        <div>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="create-blog.html">Create Blog</a>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>
    </nav>

    <section class="dashboard">

        <div class="profile-box" id="profileBox">
            <h2>Loading profile...</h2>
        </div>

        <h1>My Dashboard</h1>
        <p>Manage your blogs and create new posts.</p>

        <a href="create-blog.html" class="create-btn">+ Create New Blog</a>

        <div class="blog-container" id="blogContainer">
            <p>Loading blogs...</p>
        </div>

    </section>

    <footer>
        <p>© 2026 MyBlog. All Rights Reserved.</p>
    </footer>

    <script>
        const token = localStorage.getItem("token");

        if (!token) {
            alert("Please log in to view your dashboard.");
            window.location.href = "login.html";
        }

        function loadProfile() {
            const userData = localStorage.getItem("user");
            const profileBox = document.getElementById("profileBox");

            if (userData) {
                const user = JSON.parse(userData);
                profileBox.innerHTML = `
                    <h2>Welcome, ${user.name}!</h2>
                    <p>${user.email}</p>
                `;
            }
        }

        async function loadBlogs() {
            try {
                const response = await fetch("http://localhost:5000/api/my-blogs", {
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                });

                if (response.status === 401) {
                    alert("Your session expired. Please log in again.");
                    localStorage.removeItem("token");
                    localStorage.removeItem("user");
                    window.location.href = "login.html";
                    return;
                }

                const blogs = await response.json();

                const blogContainer = document.getElementById("blogContainer");

                blogContainer.innerHTML = "";

                if (blogs.length === 0) {
                    blogContainer.innerHTML = "<p>You haven't created any blogs yet.</p>";
                    return;
                }

                blogs.forEach(blog => {

                    const blogCard = document.createElement("a");
                    blogCard.className = "blog-card";
                    blogCard.href = `blog-details.html?id=${blog._id}`;

                    blogCard.innerHTML = `
                        <h3>${blog.title}</h3>
                        <p class="author">By: ${blog.author}</p>
                        <p>${blog.content.substring(0, 100)}${blog.content.length > 100 ? "..." : ""}</p>
                    `;

                    blogContainer.appendChild(blogCard);
                });

            } catch (error) {
                document.getElementById("blogContainer").innerHTML =
                    "<p>Unable to load blogs. Make sure the backend server is running.</p>";

                console.error(error);
            }
        }

        document.getElementById("logoutBtn").addEventListener("click", function() {
            localStorage.removeItem("token");
            localStorage.removeItem("user");
            window.location.href = "login.html";
        });

        loadProfile();
        loadBlogs();
    </script>

</body>
</html>
